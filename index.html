<link rel="stylesheet" href="assets/css/style.css">
<script>
(function(){var r=document.documentElement;r.classList.add('js');
 // decide before first paint whether the intro plays, so the room never flashes past it
 var m=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches,seen=false;
 try{seen=sessionStorage.getItem('mjdc.intro')==='1';}catch(e){}
 r.classList.add(m||seen?'intro-skip':'intro-run');
 if(m)r.classList.add('reduced');
})();
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
} }
</script>
<script src="assets/js/site.js" defer></script>
<script type="module" src="assets/js/room.js"></script>
</head>
<body>

<!-- ============================================================ intro -->
<!-- A die-cut sticker: the blade traces the contour, the sticker fills,
     then it peels away and the studio builds itself behind it. -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="sticker">
    <svg viewBox="0 0 820 320" class="sticker-svg">
      <path id="contour" class="contour" d="M170 30 H650 A130 130 0 0 1 650 290 H170 A130 130 0 0 1 170 30 Z"/>
      <path class="fill" d="M170 30 H650 A130 130 0 0 1 650 290 H170 A130 130 0 0 1 170 30 Z"/>
      <text class="s-name" x="410" y="152" text-anchor="middle">Mary Jane</text>
      <text class="s-role" x="410" y="212" text-anchor="middle">DESIGN &#8594; CUT &#8594; FIT</text>
      <circle class="blade" r="7">
        <animateMotion dur="1.35s" fill="freeze" begin="indefinite" id="bladeRun" rotate="auto">
          <mpath href="#contour"/>
        </animateMotion>
      </circle>
    </svg>
  </div>
  <p class="intro-cap">Graphic Artist &middot; Mandaue City, Cebu</p>
  <button class="intro-skipbtn" type="button" id="skip">Skip &#8594;</button>
</div>

<!-- ============================================================ stage -->
<main class="stage" id="stage">
  <canvas id="room" aria-label="A 3D graphic-art studio: a vinyl cutting plotter, a design desk, vinyl rolls, and Mary Jane's work framed on the walls."></canvas>
  <div class="pins" id="pins"></div>
  <div class="tip" id="tip" role="status"></div>

  <div class="fallback">
    <img src="assets/img/mary-jane.png" alt="Mary Jane Dela Cruz" width="864" height="1080">
  </div>
</main>

<header class="brand">
  <a class="brand-link" href="./" aria-label="Mary Jane Dela Cruz, home">
    <img class="mark" src="assets/img/avatar.jpg" alt="" width="160" height="160">
    <span class="brand-txt"><b>Mary Jane Dela Cruz</b><small>Graphic Artist</small></span>
  </a>
</header>

<section class="hero" aria-label="Introduction">
    <p class="eyebrow">Mandaue City &middot; Cebu &middot; Philippines</p>
    <h1>Design <span>&#8594;</span> Cut <span>&#8594;</span> Fit.</h1>
    <p class="pitch">Five years in advertising and print. Step into the studio &mdash; every piece on the walls is real work.</p>
</section>

<nav class="dock" aria-label="Main">
  <button type="button" data-panel="about"><span>About</span></button>
  <button type="button" data-panel="services"><span>Services</span></button>
  <button type="button" data-panel="work"><span>Portfolio</span></button>
  <button type="button" data-panel="contact"><span>Contact</span></button>
</nav>
<p class="hint" id="hint">Drag to look around &middot; click anything with a pin</p>

<!-- =========================================================== drawer -->
<aside class="drawer" id="drawer" role="dialog" aria-labelledby="d-title" aria-hidden="true">
  <div class="drawer-head">
    <p class="kicker" id="d-kicker"></p>
    <h2 id="d-title"></h2>
    <button class="x" type="button" id="d-close" aria-label="Close">&times;</button>
  </div>
  <div class="drawer-body" id="d-body"></div>
</aside>

<!-- ========================================================= lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Portfolio piece" aria-hidden="true">
  <button class="x" type="button" id="lb-close" aria-label="Close">&times;</button>
  <button class="lb-nav prev" type="button" id="lb-prev" aria-label="Previous">&#8592;</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption><span id="lb-tag"></span><b id="lb-title"></b><small id="lb-count"></small></figcaption>
  </figure>
  <button class="lb-nav next" type="button" id="lb-next" aria-label="Next">&#8594;</button>
</div>

<noscript>
  <style>.stage,.dock,.hint,.intro{display:none}</style>
  <div class="noscript">
    <p>Mary Jane Dela Cruz &mdash; Graphic Artist, Mandaue City, Cebu.</p>
    <p>Custom motorcycle decals, vehicle graphics, die-cut stickers and pattern making.</p>
    <p><a href="mailto:delacruzmaryjane2424@gmail.com">delacruzmaryjane2424@gmail.com</a></p>
  </div>
</noscript>

</body>
</html>
