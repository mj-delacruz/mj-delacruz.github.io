<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cut short &mdash; Mary Jane Dela Cruz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23000'/><text x='50%25' y='53%25' dy='.32em' text-anchor='middle' font-family='Helvetica,Arial' font-size='25' font-weight='700' fill='%23fd8f96'>MJ</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Martian+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .lost { min-height: 78vh; display: grid; place-items: center; text-align: center; background: var(--ink); color: var(--paper); }
  .lost .inner { padding: var(--gut); }
  .lost .code { font: 800 clamp(64px, 20vw, 190px)/.82 var(--display); letter-spacing: -.06em; color: var(--coral); margin: 0; }
  .lost h1 { font: 700 clamp(20px, 3.6vw, 32px)/1.1 var(--display); letter-spacing: -.03em; text-transform: uppercase; margin: 22px 0 14px; }
  .lost p { color: rgba(253,253,253,.66); margin: 0 auto 30px; max-width: 42ch; }
  .lost .dash { width: min(420px, 82vw); height: 1px; margin: 0 auto 26px; border-top: 1px dashed rgba(254,199,202,.45); }
</style>
</head>
<body>
  <div class="lost">
    <div class="inner">
      <p class="code">404</p>
      <div class="dash"></div>
      <h1>Cut short</h1>
      <p>That page is off the sheet. Nothing was nested here &mdash; head back and pick a section.</p>
      <a class="btn btn-solid" href="/">Back to the portfolio</a>
    </div>
  </div>
</body>
</html>
